name: Slapp
options:
  bundleIdPrefix: com.snail3d
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9V8U7PCW58
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Slapp:
    type: application
    platform: iOS
    sources:
      - path: Slapp
        excludes: ["Info.plist"]
    info:
      path: Slapp/Info.plist
      properties:
        CFBundleDisplayName: Slapp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: "Hold to talk — your voice is sent to your Slapp bridge and the reply lands in your chat."
        NSCameraUsageDescription: "Triple-tap to snap a photo and send it to the agent with your voice note."
        NSPhotoLibraryUsageDescription: "Pick an existing photo to send to the agent."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [audio]
        BGTaskSchedulerPermittedIdentifiers: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snail3d.slapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Slapp:
    build:
      targets:
        Slapp: all
    run:
      config: Debug
